name: PoC Pages (manual)

# Publishes ONLY the offline proof of concept (poc/offline-pwa, test data, no secrets) to GitHub Pages.
# Manual trigger only: it never runs on push or merge. Product code is not published.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: poc-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # Lockfile install without lifecycle scripts; only needed to bundle the sign-in test (firebase + esbuild).
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build static proof of concept
        run: node poc/offline-pwa/build-static.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: poc/offline-pwa/dist

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
